# UAT gate. This file keeps the name deploy-labs.yml on purpose: workflow_dispatch only works for a
# workflow file that exists on the default branch, and this is the one main already has. GitHub runs the
# version found on the branch you pick under "Use workflow from", so on deploy-osd-uat it is this one.
# It is never merged: main keeps the real labs workflow.
name: Deploy UAT

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing tag to deploy (skips the build)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  frontend:
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      deploy_env: uat
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
