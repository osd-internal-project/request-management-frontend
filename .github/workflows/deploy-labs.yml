# Builds the app, pushes it to Huawei SWR (ap-southeast-2), and restarts the
# labs stack on the VM.
#
# The deploy half runs on a self-hosted runner on that VM. Preparing the machine
# is a one-time job documented in the backend repo's docs/labs-server-setup.md.
# `deploys/cloudpond` carries a separate Helm pipeline against a k8s cluster —
# that one is not touched by this workflow.
name: Labs deploy

on:
  push:
    branches: [deploys/labs]
  workflow_dispatch:

env:
  APP_NAME: request-management-frontend
  REGISTRY: swr.ap-southeast-2.myhuaweicloud.com
  # Set the `HUAWEI_SWR_ORG` repository variable if the organisation in this
  # region is not `osd-internal`.
  SWR_ORG: ${{ vars.HUAWEI_SWR_ORG || 'osd-internal' }}

concurrency:
  group: labs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.pkg.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The image tag carries the commit, so it can never be pushed over. A tag
      # of the package.json version alone is reused whenever someone forgets to
      # bump it, and the deploy then silently ships the previous build.
      - name: Read Package Info
        id: pkg
        run: |
          VER=$(jq -r .version package.json)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=${VER}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "📦 ${VER} → tag ${VER}-${SHA}"

      - name: Build Docker Image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.APP_NAME }}:${{ steps.pkg.outputs.tag }} \
            -f ./Dockerfile .

      # --password-stdin, not -p: with -p the login key is visible in the
      # runner's process list and docker prints a warning about it.
      - name: Login to Huawei Cloud SWR
        run: |
          echo "${{ secrets.HUAWEI_REGISTRY_PASSWORD }}" \
            | docker login -u "${{ secrets.HUAWEI_REGISTRY_USERNAME }}" \
                --password-stdin "${{ env.REGISTRY }}"

      - name: Tag and Push Docker Image
        run: |
          LOCAL=${{ env.APP_NAME }}:${{ steps.pkg.outputs.tag }}
          REMOTE=${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${LOCAL}
          docker tag "${LOCAL}" "${REMOTE}"
          docker push "${REMOTE}"
          echo "- \`${REMOTE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Docker Images
        if: always()
        run: |
          LOCAL=${{ env.APP_NAME }}:${{ steps.pkg.outputs.tag }}
          docker rmi "${LOCAL}" || true
          docker rmi "${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${LOCAL}" || true
          docker image prune -f

  deploy:
    needs: build-and-push
    # The labs VM, pinned by the `labs` label.
    #
    # This used to match the bare `self-hosted` label, on the reasoning that
    # there was only one runner to match. A second one appeared, and because a
    # runner's *name* is not a label, nothing distinguished them: deploys began
    # landing on whichever machine was free, and the env file this stack needs
    # exists on only one of them.
    #
    # The backend repo's docs/labs-server-setup.md covers registering a runner
    # and setting this label. Note that a label no runner carries makes this
    # job **queue silently** rather than fail — check "Waiting for a runner"
    # before assuming the deploy is merely slow.
    runs-on: [self-hosted]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # A different machine from the build job, with its own docker credentials.
      - name: Login to Huawei Cloud SWR
        run: |
          echo "${{ secrets.HUAWEI_REGISTRY_PASSWORD }}" \
            | docker login -u "${{ secrets.HUAWEI_REGISTRY_USERNAME }}" \
                --password-stdin "${{ env.REGISTRY }}"

      # The compose file declares rm-net as `external: true`, which means "this
      # already exists, do not create it" — so without this step the deploy dies
      # on `network rm-net declared as external, but could not be found`.
      # Whichever stack deploys first creates it; the guard makes the other a
      # no-op rather than an error.
      - name: Ensure Shared Network
        run: |
          docker network inspect rm-net >/dev/null 2>&1 \
            || docker network create rm-net

      # The compose file pins `container_name:`, so compose cannot rename its way
      # out of a clash: it recreates only containers its own project owns, and a
      # name held by anything else fails the deploy with "container name is
      # already in use". The usual source is a container started by hand with
      # `docker run`, or one left behind by an older project name.
      #
      # The label is checked rather than removing the name outright: a container
      # this project owns must be left to compose, so that an `up` with nothing
      # to change stays a no-op instead of becoming downtime.
      - name: Remove Conflicting Containers
        env:
          PROJECT: request-management-labs-frontend
        run: |
          set -euo pipefail
          for NAME in rm-fe; do
            # Anchored: the name filter is a substring regex, so a bare `rm-fe`
            # would also match `rm-fe-old`.
            ID=$(docker ps -aq --filter "name=^/${NAME}$")
            [ -n "${ID}" ] || continue
            OWNER=$(docker inspect -f \
              '{{index .Config.Labels "com.docker.compose.project"}}' "${ID}")
            if [ "${OWNER}" != "${PROJECT}" ]; then
              echo "⚠️  ${NAME} belongs to '${OWNER:-<no project>}' — removing"
              docker rm -f "${ID}"
            else
              echo "✓ ${NAME} belongs to ${PROJECT} — left to compose"
            fi
          done

      # --wait blocks until the healthcheck passes, so a container that starts
      # and immediately fails its check fails the deploy rather than being
      # reported as shipped.
      #
      # --remove-orphans clears containers of services that have since been taken
      # out of the compose file; without it they keep running against nothing.
      - name: Pull and Start
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          docker compose -f infra/labs/docker-compose.yml \
            up -d --pull always --remove-orphans --wait --wait-timeout 180

      - name: Debug on Failure
        if: failure()
        run: |
          echo "====== CONTAINERS ======"
          docker compose -f infra/labs/docker-compose.yml ps
          echo "====== LOGS ======"
          docker compose -f infra/labs/docker-compose.yml logs --tail=50

      # Old tags accumulate on the VM — every deploy leaves the previous image
      # behind, and nothing else reclaims it. Keeping a fixed number of tags per
      # repository rather than an age: `until=168h` both let a busy week fill the
      # disk and, on a quiet one, `-a` swept every image no container happened to
      # be using — including ones belonging to other stacks on this VM.
      #
      # Two tags of rollback headroom stay on the machine. Anything older has to
      # be pulled from SWR again, where nothing is deleted.
      - name: Prune Old Images
        if: always()
        env:
          KEEP: 3
        run: |
          set -euo pipefail
          for REPO in \
            "${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${{ env.APP_NAME }}"; do
            echo "=== ${REPO}"
            # CreatedAt is fixed-width and single-timezone on one host, so sorting
            # it as text sorts it by time.
            docker images "${REPO}" --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' \
              | sort -r \
              | tail -n +$((KEEP + 1)) \
              | cut -f2 \
              | while read -r REF; do
                  echo "🗑  ${REF}"
                  # An image a container still holds refuses to be removed; the
                  # running one is the newest, so it is inside KEEP regardless.
                  docker rmi "${REF}" || true
                done
          done
          # Dangling layers only — no -a, so nothing else on the VM is touched.
          docker image prune -f
