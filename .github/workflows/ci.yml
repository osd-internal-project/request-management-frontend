# NFR-07 — lint and build on every merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # `next build` type-checks the whole app, which is where the mistakes
      # this codebase actually makes show up: a prop that crosses the
      # server→client boundary, or a client module's constant imported by a
      # server component.
      - name: Build
        run: yarn build
        env:
          # Build-time only. The app reads real values from the environment at
          # runtime; these exist so `next build` can resolve its config without
          # a live backend or realm.
          BACKEND_USER_SERVICE_URL: http://localhost:3001
          BACKEND_CORE_SERVICE_URL: http://localhost:3002
          KEYCLOAK_BASE_URL: http://localhost:8180
          KEYCLOAK_REALM: ci
          KEYCLOAK_CLIENT_ID: ci
          KEYCLOAK_CLIENT_SECRET: ci
          APP_BASE_URL: http://localhost:3000

  # NFR-06 — user-facing words belong in `src/lib/messages.ts` so another
  # language can be added later.
  #
  # Advisory, not blocking: roughly a dozen files still carry Thai literals
  # (BFF error bodies, antd placeholders, unit suffixes like `ชม.`). Turning
  # that red today would mean a build nobody looks at. The count is printed so
  # it can be driven down, and flipped to blocking once it reaches zero.
  messages-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Report Thai text outside messages.ts
        continue-on-error: true
        run: |
          files=0
          for f in $(grep -rlP '[\x{0E00}-\x{0E7F}]' src \
                       --include='*.tsx' --include='*.ts' \
                     | grep -v 'src/lib/messages.ts'); do
            # Comment lines are fine — the specification is quoted in Thai
            # throughout. Only literals and JSX text count.
            hits=$(grep -nP '[\x{0E00}-\x{0E7F}]' "$f" \
                     | grep -vP '^\s*[0-9]+:\s*(\*|//|/\*)' \
                     | grep -P '["'"'"'`>]' || true)
            if [ -n "$hits" ]; then
              files=$((files + 1))
              echo "$f"
              echo "$hits" | sed 's/^/    /'
            fi
          done
          echo "::notice::${files} file(s) still hold Thai outside messages.ts"
