namespace: request-management-prod

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

ingress:
  host: request-management.osd.co.th
  tls:
    enabled: true
    secretName: request-management-prod-tls

# Helm merges maps key by key, so the WHOLE map is written in every env file —
# a partial one silently keeps a value from values.yaml.
configmap:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  APP_ORIGIN: "https://request-management.osd.co.th"
  USER_SERVICE_URL: "http://request-user-service.request-management-prod.svc.cluster.local:8884"
  CORE_SERVICE_URL: "http://request-core-service.request-management-prod.svc.cluster.local:8885"
  SESSION_IDLE_TIMEOUT_SECONDS: "900"
  SESSION_REFRESH_INTERVAL_SECONDS: "300"

secrets: {}

hostAliases:
  - ip: "10.134.1.5"
    hostnames:
      - "request-management.osd.co.th"
      - "sso.osd.co.th"

resources:
  requests:
    memory: "192Mi"
    cpu: "100m"
  limits:
    memory: "384Mi"
    cpu: "500m"
