namespace: request-management-sit

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

ingress:
  host: request-management-sit.osd.co.th
  tls:
    enabled: true
    secretName: request-management-sit-tls

# Helm merges maps key by key, so the WHOLE map is written in every env file —
# a partial one silently keeps a value from values.yaml.
configmap:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  APP_ORIGIN: "https://request-management-sit.osd.co.th"
  USER_SERVICE_URL: "http://request-user-service.request-management-sit.svc.cluster.local:8884"
  CORE_SERVICE_URL: "http://request-core-service.request-management-sit.svc.cluster.local:8885"
  SESSION_IDLE_TIMEOUT_SECONDS: "900"
  SESSION_REFRESH_INTERVAL_SECONDS: "300"

secrets: {}

hostAliases:
  - ip: "10.134.1.5"
    hostnames:
      - "request-management-sit.osd.co.th"
      - "auth-request-management-sit.osd.co.th"

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"
