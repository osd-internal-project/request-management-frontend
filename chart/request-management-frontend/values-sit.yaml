namespace: request-management-sit

replicaCount: 1

ingress:
  host: request-management-sit.osd.co.th
  tls:
    secretName: request-management-frontend-sit-tls

env:
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  APP_ORIGIN: "https://request-management-sit.osd.co.th"
  USER_SERVICE_URL: "http://user-service.request-management-sit.svc.cluster.local:3001"
  CORE_SERVICE_URL: "http://core-service.request-management-sit.svc.cluster.local:3002"
  SESSION_IDLE_TIMEOUT_SECONDS: "900"
  SESSION_REFRESH_INTERVAL_SECONDS: "300"

secrets: {}

hostAliases:
  - ip: "10.134.1.5"
    hostnames:
      - "request-management-sit.osd.co.th"

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"
