appName: request-management-frontend
deploymentName: request-management-frontend
ingressName: request-management-frontend-ingress
serviceName: request-management-frontend
namespace: request-management-prod

replicaCount: 3

image:
  repository: docker.io/library/request-management-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 3000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  host: request-management.osd.co.th
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: request-management-frontend-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

env:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  APP_ORIGIN: "https://request-management.osd.co.th"
  USER_SERVICE_URL: "http://user-service:3001"
  CORE_SERVICE_URL: "http://core-service:3002"
  SESSION_IDLE_TIMEOUT_SECONDS: "900"
  SESSION_REFRESH_INTERVAL_SECONDS: "300"

secrets: {}

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"
